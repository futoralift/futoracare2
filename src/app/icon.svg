<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Soft Border -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Modern Medical Cross / Heartbeat -->
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top arm -->
    <path d="M32 14 V26" />
    <!-- Bottom arm -->
    <path d="M32 38 V50" />
    <!-- Pulse Line Through Center -->
    <path d="M14 32 H24 L28 22 L36 42 L40 32 H50" stroke="#38bdf8" filter="url(#glow)" stroke-width="4" />
  </g>

  <!-- Central AI Pulse Sparkle Dot -->
  <circle cx="36" cy="42" r="2.5" fill="#ffffff" />
</svg>
